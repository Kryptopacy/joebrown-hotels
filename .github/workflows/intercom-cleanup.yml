name: Intercom Cleanup Cron

on:
  schedule:
    # Run at 02:00 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cleanup API Endpoint
        run: |
          curl -X POST "${{ secrets.PRODUCTION_URL }}/api/cron/intercom" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
